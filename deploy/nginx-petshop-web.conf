server {
    listen 80;
    listen [::]:80;
    server_name 68.211.121.127 petshop-web.chilecentral.cloudapp.azure.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://petshop-web.chilecentral.cloudapp.azure.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 68.211.121.127;

    ssl_certificate /etc/letsencrypt/live/petshop-web/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petshop-web/privkey.pem;

    return 301 https://petshop-web.chilecentral.cloudapp.azure.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name petshop-web.chilecentral.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/petshop-web-domain/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/petshop-web-domain/privkey.pem;

    root /var/www/petshop-web;
    index index.html;

    location /api/ {
        proxy_pass https://172.16.0.5;
        proxy_ssl_server_name on;
        proxy_ssl_name petshop-app.chilecentral.cloudapp.azure.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 2;
        proxy_set_header Host petshop-app.chilecentral.cloudapp.azure.com;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location ~ /\. {
        deny all;
    }
}
